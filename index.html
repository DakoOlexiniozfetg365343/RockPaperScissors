<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../rockPaperScissors/main.css" />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
      <img
        src="../rockPaperScissors/images/rock-emoji.png"
        class="move-icon"
        alt="rock"
      />
    </button>
    <button class="move-button js-paper-button">
      <img
        src="../rockPaperScissors/images/paper-emoji.png"
        class="move-icon"
        alt=""
      />
    </button>
    <button class="move-button js-scissors-button">
      <img
        src="../rockPaperScissors/images/scissors-emoji.png"
        class="move-icon"
        alt=""
      />
    </button>
    <p class="showResult result"></p>
    <p class="stats score"></p>
    <button class="reset">Reset Score</button>
    <button class="auto-play">Auto Play</button>
    <div class="confirm"></div>

    <script src="../rockPaperScissors/main.js"></script>
  </body>
</html>
